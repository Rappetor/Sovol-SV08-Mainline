# Configuration for Eddy USB probe. Adapted for SV08 mainline from
# https://github.com/bigtreetech/Eddy/blob/master/sample-bigtreetech-eddy-zoffbeta.cfg
# (i.e., using Eddy for both bed mesh and probing), updated for mainline Klipper as of 2026
# (descend_z, last_probe_position, native "tap" probing and tap_z_offset).
# Follow the guide at https://github.com/bigtreetech/Eddy, but skipping everything
# about configuration except setting the serial path below. (In other words, do only
# mounting, firmware compilation and calibration.) You can find a mount that allows you
# to fit the Eddy under the regular SV08 shroud (instead of the old probe, in the same place)
# at https://www.printables.com/model/968900-sovol-sv08-btt-eddy-mount.
# If you are connecting the probe in some other way, adjust x_offset and y_offset below
# (see the BTT guide for information).
#
# Please make sure you add 'METHOD=rapid_scan' to your BED_MESH_CALIBRATE (e.g. in the START_PRINT macro)
#
# Optional: to zero Z with a nozzle "tap" before each print, calibrate tap_threshold
# (see https://www.klipper3d.org/Eddy_Probe.html#tap-calibration) and uncomment the
# CLEAN_NOZZLE / TAP_Z lines in START_PRINT. Babysteps are then saved as tap_z_offset
# with Z_OFFSET_APPLY_PROBE (or Mainsail's Save button) followed by SAVE_CONFIG.
#
# TODO: It would be nice to use the physical probe to automate the setup completely,
# but that probably requires a fair bit of scripting.

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_  # Change this to your own path
restart_method: command

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10 # Sets the minimum tempereature for eddys tempereature sensor to operate
max_temp: 100 # Sets the maximum tempereature for eddys tempereature sensor to operate

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 2.5 # (formerly z_offset) Set to a non-zero value, this is the height a probing attempt stops at, read: https://www.klipper3d.org/Config_Reference.html#probe_eddy_current
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -16 # These offsets are for the above linked Eddy mount on the stock toolhead.
y_offset: 11.5

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2
calibration_position: 319,176,5 ; This sets the position for temperature drift calibration over the center right heatbed screw, for a more accurate reading during calibration.

[bed_mesh]
speed: 150 #500
horizontal_move_z: 3
mesh_min: 15,18 # These min/max points are with the above linked Eddy mount on the stock toolhead.
mesh_max: 335,335
probe_count: 15,15 # 25,25 # Set to a lower 15,15 default as it appears a too high probe_count (too dense mesh) is bad with rapid_scan, see: https://www.klipper3d.org/Bed_Mesh.html#rapid-continuous-scanning
algorithm: bicubic
bicubic_tension: 0.5
split_delta_z: 0.0125 # see: https://www.klipper3d.org/Bed_Mesh.html#move-splitting
mesh_pps: 3,3
adaptive_margin: 5
zero_reference_position: 177.5,177.5 # Same nozzle XY as TAP_Z, so the mesh is 0 where Z was zeroed by the tap
fade_start: 1
fade_end: 10
fade_target: 0
#scan_overshoot: 5  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.

# COMMENTED FOR REFERENCE, WE NOW USE HOMING OVERRIDE BELOW
#[safe_z_home]
#home_xy_position: 172, 172
#z_hop: 10
#z_hop_speed: 25
#speed: 200

# THIS HOMING OVERRIDE ALWAYS GOES BACK TO CENTER FIRST BEFORE HOMING THE OTHER AXIS
# THIS ALREADY INCLUDES THE EDDY HOMING OVERRIDES/CHANGES
[homing_override]
gcode:
  # Move 5 up, just in case (this is our safety zhop, this needs 'set_position_z: 0' below)
  G91 ; set relative positioning
  G0 Z5 F1000 ; 5 up zhop
  {% if not rawparams or 'Y' in rawparams|upper %}
    {action_respond_info('Homing Y')}
    G28 Y
    G90 ; set absolute positioning
    G0 Y177.5 F6000 ; return to center
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'X' in rawparams|upper %}
    {action_respond_info('Homing X')}
    G28 X
    G90 ; set absolute positioning
    G0 X177.5 F6000 ; return to center
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'Z' in rawparams|upper %}
    {action_respond_info('Homing Z')}
    G90 ; set absolute positioning
    G0 X177.5 Y177.5 F6000 ; return to center, please add your offsets manually if you want to
    G28 Z
    G0 Z10 F1000 ; move to z10 before probe
    PROBE # Eddy needs a manual PROBE before calling the 'SET_Z_FROM_PROBE'
    SET_Z_FROM_PROBE
    G0 Z5 F1000 ; move to z5 to finish
    M400 ; Wait for move to finish
  {% endif %}
  G90 ; set absolute positioning
axes: xyz
set_position_z: 0 # This forces the z position to be at 0 when we start homing, so we can move the Z up before homing.

###############################Macros and related################################
# Z babystepping uses Klipper's own SET_GCODE_OFFSET (no override). To keep a babystep
# for future tap-zeroed prints, run Z_OFFSET_APPLY_PROBE (or Mainsail's Save button) and
# then SAVE_CONFIG; Klipper stores it as tap_z_offset. See Z_OFFSET_APPLY_PROBE below.

# Sets Z from the last PROBE: last_probe_position.z is the bed contact height in toolhead
# coordinates, so shift the kinematic Z to make that contact point Z=0. Used after the eddy
# homing move and after a tap. Must stay a separate macro so it is evaluated after PROBE finishes.
[gcode_macro SET_Z_FROM_PROBE]
gcode:
    SET_KINEMATIC_POSITION Z={printer.toolhead.position.z - printer.probe.last_probe_position.z} SET_HOMED=Z

# Taps the nozzle on the bed centre and zeroes Z at the contact point (requires tap_threshold
# to be calibrated). Requires homed axes and a clean nozzle at 150C or cooler (protects the PEI).
[gcode_macro TAP_Z]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
      {action_raise_error("TAP_Z: home all axes first")}
    {% endif %}
    {% if printer.extruder.target > 150 or printer.extruder.temperature > 155 %}
      {action_raise_error("TAP_Z: nozzle must be 150C or cooler before tapping")}
    {% endif %}
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    G90
    G1 Z5 F1000
    G1 X177.5 Y177.5 F6000
    M400
    PROBE METHOD=tap
    SET_Z_FROM_PROBE
    G1 Z5 F1000
    M400

# Mainsail's Z-offset Save button (and Sovol's _CALIBRATION_ZOFFSET) send a bare
# Z_OFFSET_APPLY_PROBE, which on an eddy probe would rewrite the height calibration.
# Default it to METHOD=tap so babysteps go to tap_z_offset instead. To deliberately
# shift the eddy height calibration, use Z_OFFSET_APPLY_PROBE METHOD=calibration.
[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: _Z_OFFSET_APPLY_PROBE_EDDY
gcode:
    {% if params.METHOD is defined %}
      _Z_OFFSET_APPLY_PROBE_EDDY {rawparams}
    {% else %}
      _Z_OFFSET_APPLY_PROBE_EDDY METHOD=tap {rawparams}
    {% endif %}

# This macro automates a lot of the frequency mapping process and simplifies the steps significantly.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90 # Abs positioning
  G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 } # Allows the user to work it down until it touches.
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}

# This moves the nozzle above the center right heatbed screw so we have a fixed place for our temperature drift calibration (and I don't have to remember the coordinates)
[gcode_macro PROBE_EDDY_MOVE_TO_SCREW]
gcode:
  BED_MESH_CLEAR
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  G90
  G1 X319 Y176 Z5 F6000
